gate_follower:
  ros__parameters:
    # 대회 게이트 7쌍 (2026-11-12). 예전 수조 시험은 3쌍.
    gate.required_pairs: 7
    # 경로 명령은 기본적으로 미리보기만 발행한다.
    gate.motion_enabled: false
    gate.thrust_ratio: 0.5              # waypoint(첫 게이트 접근) 구간
    gate.los_thrust_ratio: 0.35         # LOS 경로 추종 구간 직진 — 0.25 → 0.4(바람) → 0.3 (2026-11-12, 0.4 = 실측 1.0 m/s 라 빠름) → 0.35 (2026-11-13, 조금 더 빠르게)
    gate.los_turn_ratio: 0.31           # LOS 경로 추종 구간 회전 상한 — 수조 회피 SOTA
    gate.occ_threshold: 95
    gate.min_cluster_cells: 2
    gate.max_cluster_extent: 2.0        # 1.2 → 2.0: 실제 부표 덩어리 최대 2.0 m (1.2 면 게이트 하나 건너뜀)
    gate.min_gate_width: 1.5
    gate.max_gate_width: 7.0
    gate.max_pair_skew_deg: 35.0        # 게이트선이 다가가는 방향의 수직에서 기울어도 되는 각도 (휜 통로)
    gate.gate_circle_margin: 1.2        # 두 기둥을 지름으로 한 원 × 이 배수 안에 다른 기둥 → 대각선 오쌍으로 거름
    gate.min_gate_forward: 0.3
    gate.max_gate_forward: 6.0          # 쌍 후보 부표의 앞 거리 상한 (9 → 6: 먼 지도 가장자리 오쌍 방지)
    gate.max_midpoint_lateral: 2.5
    gate.passed_pair_exclusion: 1.0
    gate.min_pair_advance: 0.8
    # 연속 게이트 중점의 좌우 어긋남 허용치 [m]. 간격 2.5 m 통로가 35° 휘면 1.43 m.
    # ⚠ 실제 어긋남보다 작으면 그 게이트를 건너뛰고 다음 게이트를 고른다(누락).
    gate.max_midpoint_shift: 2.0
    gate.exit_distance: 1.0
    gate.sample_spacing: 0.05
    gate.min_clearance: 0.5
    gate.safe_threshold: 1.0
    gate.max_goal_after_gates: 4.0
    gate.scan_match_radius: 0.7
    gate.scan_timeout_sec: 0.7
    gate.grid_timeout_sec: 0.7
    # 배 중심이 게이트선 이 거리 안이면 기둥 보임 조건을 끈다 (선수 라이다 뒤쪽 가림 대응)
    gate.visibility_release_distance: 1.0
    # 같은 쌍으로 이 시간 넘게 못 가면 쌍을 버리고 다시 고름 (넘었으면 통과 인정)
    gate.replan_timeout_sec: 2.0
    gate.reject_hold_sec: 3.0           # 버린 쌍을 후보에서 빼 두는 시간 (10 → 3: 그동안 추진 0 으로 밀림)
    # 기둥 보임: 두 기둥이 각각 1초 안에 한 번 잡혔으면 보임 (0 = 지금 스캔에 둘 다 — 4번에 1번 추진 0)
    gate.post_visible_timeout_sec: 1.0
    # 서서 기다릴 때 자리·선수각 지키기 추력 (0 = 추진 0). 시뮬에서 아직 득실이 섞여 끔
    gate.hold_thrust_ratio: 0.0
    # 게이트 사슬 (2026-11-12): 다음 게이트를 기억한 부표로 미리 골라 경로를 중점들로 이어 둔다.
    # 1 이면 미리 잇지 않음(지금 게이트를 지나는 순간 다음 쌍을 고름).
    gate.max_chain_gates: 3
    gate.check_horizon: 6.0             # 경로 안전·관측 검사 길이 [m] (사슬 끝은 지도 창 밖일 수 있음)
    # 부표 기억: 0.7 m 안이면 같은 부표, 지도에서 3번 잡히면 확정. 4 m 안(볼 수 있는 거리)에
    # 들어온 뒤 1초 넘게 안 잡히면 지움(물보라·반사), 배에서 15 m 넘으면 버림.
    gate.memory_match_radius: 0.7
    gate.memory_confirm_hits: 3
    gate.memory_forget_sec: 1.0
    gate.memory_recheck_range: 4.0
    gate.memory_prune_range: 15.0
    # 지도가 unknown 이어도 지금 스캔 빔이 지나 본 점(더 멀리서 맞음·무반사 inf)은 관측으로 침.
    # 게이트 두 부표 사이 물은 뒤에 맞을 게 없어 지도에 unknown 으로 남아 PATH_UNOBSERVED 로 멈췄다.
    gate.see_through_range: 6.0             # 이 거리 [m] 안만
    gate.see_through_max_bearing_deg: 110.0 # 선수 기준 ±각도 (뒤 120°~240° 는 선체 가림 마스크)
    # 관측 검사 완화: 안 본 칸은 경로 앞 3 m·lookahead 직선만 보고, 걸려도 서지 않고 직진을
    # 절반으로 줄여 계속 감 (상태 FOLLOW_GATE_n/7_SLOW). 장애물은 안전 검사(앞 6 m)가 거름.
    gate.observed_horizon: 3.0
    gate.unobserved_thrust_scale: 0.5
