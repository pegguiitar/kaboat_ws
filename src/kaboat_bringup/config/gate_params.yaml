gate_follower:
  ros__parameters:
    # 실내 수조 시험: 세 쌍. 실외 4쌍 이상이면 실제 개수로 변경.
    gate.required_pairs: 3
    # 경로 명령은 기본적으로 미리보기만 발행한다.
    gate.motion_enabled: false
    gate.thrust_ratio: 0.5              # waypoint(첫 게이트 접근) 구간
    gate.los_thrust_ratio: 0.3          # LOS 경로 추종 구간 — los_path_test 검증값
    gate.occ_threshold: 95
    gate.min_cluster_cells: 2
    gate.max_cluster_extent: 1.2
    gate.min_gate_width: 1.5
    gate.max_gate_width: 7.0
    gate.max_pair_along_error: 0.75
    gate.min_gate_forward: 0.3
    gate.max_gate_forward: 9.0
    gate.max_midpoint_lateral: 2.5
    gate.passed_pair_exclusion: 1.0
    gate.min_pair_advance: 0.8
    # 연속 게이트 중점의 좌우 어긋남 허용치 [m]. 지금은 코스 어긋남 최대 1 m 가정.
    # ⚠ 대회장에서 실제 게이트 배치를 재고 수정할 것. 실제 어긋남보다 작으면
    #   그 게이트를 건너뛰고 다음 게이트를 고른다(경로가 막혀 멈추거나 누락).
    gate.max_midpoint_shift: 1.0
    gate.exit_distance: 1.0
    gate.sample_spacing: 0.05
    gate.min_clearance: 0.5
    gate.safe_threshold: 1.0
    gate.max_goal_after_gates: 4.0
    gate.scan_match_radius: 0.7
    gate.scan_timeout_sec: 0.7
    gate.grid_timeout_sec: 0.7
    # 배 중심이 게이트선 이 거리 안이면 기둥 보임 조건을 끈다 (선수 라이다 뒤쪽 가림 대응)
    gate.visibility_release_distance: 1.0
    # 같은 쌍으로 이 시간 넘게 못 가면 쌍을 버리고 다시 고름 (넘었으면 통과 인정)
    gate.replan_timeout_sec: 2.0
    gate.reject_hold_sec: 10.0          # 버린 쌍을 후보에서 빼 두는 시간
