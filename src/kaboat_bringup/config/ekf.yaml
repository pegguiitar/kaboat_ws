# robot_localization EKF 설정 (실물 전용 placeholder).
#
# sim 에서는 Gazebo OdometryPublisher 플러그인이 ground-truth /odom 을 그대로
# 발행하므로 이 파일을 쓰지 않는다. 실물 전환 시:
#   1) ros-humble-robot-localization 설치
#   2) ekf_node + navsat_transform_node 를 이 설정으로 실행
#   3) 출력 /odometry/filtered 를 /odom 으로 리매핑
# 하면 상위 노드(mission_manager, behaviors)는 변경 없이 그대로 동작한다.
#
# TODO(팀) 실물 센서 장착 후 프레임/공분산/주파수 튜닝

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true            # 수상정 — z/roll/pitch 추정 제외
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: wamv/base_link
    world_frame: odom

    # IMU (EBIMU-9DOFv5-R3) — 자세/각속도/가속도
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # GPS → navsat_transform_node 가 변환한 odometry
    odom0: /odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
