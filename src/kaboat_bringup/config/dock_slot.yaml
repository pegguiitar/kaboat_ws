# 도킹 슬롯·선체 치수 — 슬롯/선체 크기와 관련된 값은 모두 이 파일에서만 정한다.
#
# launch 인자나 코드에 같은 값을 따로 적지 않는다. 다른 슬롯(수조 모형, 대회장)을
# 쓸 때는 이 파일을 고치거나 복사해 `slot_config:=/절대/경로.yaml` 로 넘긴다.
#
# 슬롯(wall_to_mouth_m, slot_width)은 2026-11-12 야외 도킹장 라이다 실측값이다(아래 "실측" 참고).
# ⚠ 선체(hull_width, hull_length)는 아직 **실측 전 가정치**다 — 재서 채운 뒤
# `dimensions_measured: true` 로 바꾼다(false 인 동안 시작 시 경고가 뜬다).
# 값이 서로 안 맞으면(선체가 슬롯보다 넓음, 선수가 뒷벽에 닿음 등) 노드가
# 시작하지 않는다 — 검사 규칙은 kaboat_behaviors/slot_dimensions.py 참고.
#
# 길이 단위는 모두 미터. 그림(위에서 본 모습, 표식은 뒷벽 중앙):
#
#     ┌──────────────────────┐ ← 뒷벽 (표식)
#     │ ←── slot_width ────→ │
#     │        ▲             │
#     │        │ wall_to_mouth (뒷벽 면 → 입구 면)
#     │        ▼             │
#     └──┘                └──┘ ← 입구 (옆벽 끝)
#
# ── 실측: 야외 도킹장 (2026-11-12, bag run_20261112_152344, RTK) ──────────────
# 파란 큐브 부잔교 하나에 슬롯 3개. 라이다 스캔면(수면 위 약 0.14 m) 높이에서 잰 면 위치다.
# 6 m 안·수평 스캔을 도킹장 축으로 누적한 지도 + 스캔 한 장 안 측정(odom 오차 없음)으로 교차 확인.
#
#   위에서 본 모습 (물 쪽이 아래, 화면 왼쪽 = 물에서 도크를 볼 때 왼쪽)
#        ┌──── 뒷벽 (세 슬롯이 한 직선, ±5 cm) ───────────────────────┐
#   ┌──┐ │ 슬롯 2.97 │ ┌───┐ │ 슬롯 2.97 │ ┌───┐ │ 슬롯 2.97 │ ┌──┐
#   │  │ │  깊이1.94 │ │1.05│ │           │ │1.05│ │           │ │  │  ← 칸막이 폭 ~1.05
#   └──┘ └───────────┘ └───┘ └───────────┘ └───┘ └───────────┘ └──┘  ← 칸막이 끝(입구)
#     슬롯 중심 간격 ~4.0 m (3.99 / 4.06), 칸막이 끝 네 개도 한 직선
#
#   슬롯 폭(칸막이 안쪽 면 사이): 누적 2.98 / 2.96 / 2.94 m, 한 장 3.005 m → 2.97 m
#   깊이(뒷벽 면 → 칸막이 끝 면): 누적 1.93 / 1.99 / 1.90 m, 한 장 1.98 / 1.92 m → 1.94 m
#   칸막이(안쪽 두 개) 폭: 1.02 / 1.11 m. 양 끝 칸막이는 끝이 0.2 m 더 나온 턱이 있다.
#   ⚠ 표식판이 슬롯 한가운데가 아닐 수 있다 — YOLO 시선이 뒷벽에 닿은 점(가까이서)이 슬롯 중심에서
#     물에서 볼 때 오른쪽으로 삼각형 0.37 m(근거 85개, 흩어짐 3 cm), 사각형 0.53 m(20개, 30 cm),
#     원 왼쪽 0.08 m. 대회 배치가 바뀌면 다시 잰다.
#
docking_ctrl:
  ros__parameters:
    dock:
      dimensions_measured: false

      # ── 슬롯 ────────────────────────────────────────────────
      # 뒷벽(표식이 붙은 벽) 면에서 선체가 슬롯으로 들어서는 입구 면까지의 수평
      # 거리. 옆벽이 입구보다 튀어나오거나 짧으면 옆벽 길이가 아니라 입구 면 기준.
      wall_to_mouth_m: 1.94       # 실측 2026-11-12 (위 "실측")
      # 옆벽(칸막이) 안쪽 면 사이 폭. 입구 확인에서 라이다로 잰 폭과 비교한다.
      slot_width: 2.97            # 실측 2026-11-12
      # 위 폭과 라이다 측정 폭의 허용 차이 [m]
      slot_width_tolerance: 0.5

      # ── 선체 ────────────────────────────────────────────────
      # 선체 실제 폭·전장. 옆벽 간격(선체 가장자리~벽)과 후진 거리 계산에 쓴다.
      hull_width: 1.0             # ← 실측 필요 (가정치)
      hull_length: 1.0            # ← 실측 필요 (가정치)

      # ── 접안/진입 기준점 ────────────────────────────────────
      # 접안 시 base_link(선체 중심) → 뒷벽 거리. 선수 끝~뒷벽 여유는
      # berth_distance - hull_length/2 (0.1m 이상이어야 한다).
      berth_distance: 1.0
      # W1(입구 바깥 첫 목표점) 이 입구에서 바깥으로 떨어진 거리
      pre_entry_offset: 1.5
      # 후진 완료 판정: 선미가 입구에서 이만큼 더 벗어나야 한다.
      # 후진 최소거리 = wall_to_mouth_m + hull_length/2 + 이 값 - berth_distance
      exit_clearance_m: 0.2
