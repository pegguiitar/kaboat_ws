# mission_manager 파라미터 — 미션별 목표좌표(odom 기준 [m])와 전환 반경.
#
# ⚠️ odom 좌표계는 world 좌표계와 100% 동일하다 — 배 스폰 위치와 무관하다.
# (gz-sim-odometry-publisher-system 이 world 절대좌표를 그대로 /odom 으로
# 발행함. 실측으로 확인: 배를 world (15, 55) 에서 스폰해도 /odom 이 그대로
# (15, 55) 로 나옴, 스폰 지점 기준 (0,0) 으로 재원점화되지 않는다.)
#
# 종합임무 경기장(kaboat_2026_comprehensive_mission)은 world (0, 60) 오프셋에
# 배치되어 있으므로, 경기장 도면 좌표 (x_도면, y_도면) → odom (x_도면, y_도면+60).
#
# 항로추종(gate)은 하단의 빨강(y=0.5)/초록(y=5.5) 부표 채널(x=5~25, x/y 간격
# 각 5m)을 왼쪽(도면 기준 아래쪽 시작점)에서 오른쪽으로 직진 통과하는 구조다.
# 배 스폰 위치(simulation.launch.py, world (2, 63.0))가 채널 왼쪽 끝이고,
# 아래 gate 목표점은 채널 오른쪽 끝(빠져나가는 지점)이다.
#
# 아래는 실제 경기장 좌표다 (예전 원점 근처 스모크테스트 사각 경로에서 교체함).

# ⚠️ 야외: 현장에서 rec 로 기록한 ~/kaboat_mission_points.json 의 <미션>_entry /
# <미션>_end 지점이 있으면 mission_manager 가 아래 entry_waypoints·entry_ready·waypoints 를
# 그 값으로 덮어쓴다(기록 당시 원점이 지금 원점과 다르면 시작 거부). 기록이 없는 미션만
# 아래 값을 쓴다. autonomy.launch.py mission_points_file:=none 이면 이 파일 값만 쓴다.

mission_manager:
  ros__parameters:
    transition_radius: 2.0   # [m] behavior 완료 신호 + 목표점 이내 진입 시 전환 (RTK, 예전 5.0)
    auto_start: true

    # 미션 제한 시간 [s] — 경기 전체 15 분(900 s) 배분. 이어 도는 실행(run_autonomy)에서만.
    # 그 미션의 접근부터 세고, 넘으면 건너뛰고 다음 미션으로(dock 은 먼저 3 m 직진 후진).
    # 일정표 = 전체 시작 + 앞 미션 몫의 합. 앞 미션이 일찍 끝나 남은 시간은 그 미션이 time_limit_carry_max
    # 까지만 더 쓰고(마감 = min(일정표 끝, 시작 + 몫 + 30 s)) 나머지는 뒤로 넘어간다 (2026-11-14 — 막힌
    # 미션이 아낀 시간을 다 먹던 것: 시뮬 station 255 s·dock 419 s·search 400 s). 늦게 시작하면 일정표 끝까지만.
    # 0 = 그 미션 제한 없음. 전부 끄기: autonomy.launch.py mission_timeouts:=false
    time_limit:
      gate:    180.0
      station: 120.0
      dock:    240.0
      search:  180.0
      avoid:   180.0
    time_limit_carry_max: 30.0   # [s] 넘어온 시간 중 한 미션이 더 쓸 수 있는 상한 (0 = 자기 몫만)
    #   마지막 미션 avoid 는 예외 — 뒤에 쓸 미션이 없어 남은 시간을 다 쓴다
    approach_timeout_sec: 90.0   # 시작 자세 접근만 이만큼 넘으면 그 미션을 건너뜀
    # behavior 포기 신호(/mission/give_up)를 받으면 제한 시간 전이라도 건너뜀 (이어 도는 실행만).
    # dock: 누적 2바퀴 돌아도 목표 도형 못 찾음 → 도크 쪽 선수로 되돌린 뒤 → 직진 후진 3 m → search
    skip_on_give_up: true

    # 각 미션 시작 자세 [odom x(m), y(m), 선수각(deg)]. 값이 미정이라
    # entry_ready=false 로 둔다. 실측값을 넣고 해당 항목을 true 로 바꿔야
    # 접근 단계가 시작된다. 0도=+X, 90도=+Y, 반시계 방향이 양수.
    entry_waypoints:
      gate:    [0.0, 0.0, 0.0]
      station: [0.0, 0.0, 0.0]
      dock:    [0.0, 0.0, 0.0]
      search:  [0.0, 0.0, 0.0]
      avoid:   [0.0, 0.0, 0.0]
    entry_ready:
      gate:    false
      station: false
      dock:    false
      search:  false
      avoid:   false

    # 아래는 각 behavior 가 완료를 보고할 때까지 사용하는 종료 목표점 [x, y].
    waypoints:
      gate:    [27.0, 63.0]   # 하단 빨강/초록 채널(x=5~25, y=0.5~5.5) 오른쪽 끝 통과
      station: [15.0, 73.0]   # 좌측 구역 중심부 (오렌지 장애물 밭 안쪽 — 회피 겸용 경로)
      dock:    [65.0, 66.0]   # 가운데 빨강 슬롯(y=66) 정면 staging/후진 복귀점
      search:  [57.0, 76.0]   # 우측 탐색 구역 (오렌지/초록/빨강 부표 사이)
      avoid:   [17.5, 77.0]   # 오렌지 장애물 밭 중심
