# 가상 벽 — 라이다·카메라로 안 보이는 경계를 occupancy_grid 에 장애물(100)로 박는다.
# 위도·경도라 원점을 다시 잡아도 그대로 쓴다 (켤 때 지금 원점 기준 x·y 로 바꿈).
# 끄려면 occupancy_grid -p virtual_walls_file:=none
#
# 형식 두 가지 (같이 써도 됨):
#   arenas: 둘레 모서리(순서대로) — 변 i = 모서리 i → i+1 (마지막 → 처음). 모든 변이 벽이고
#           openings 의 변만 가운데를 그 폭 [m] 만큼 비운다. 둘레를 통째로 바깥으로 넓혀
#           모서리에서 벽이 끊기지 않는다.
#   walls:  위도·경도 꺾은선 하나하나 (따로 떨어진 벽).
# 둘 다 occupancy_grid 가 바깥쪽으로 virtual_wall_outward_offset(기본 0.6 m) 밀어 칠한다 —
# 아래 지점은 배를 모서리 부표 안쪽 옆에 대고 찍어 벽이 안쪽에 잡혔다(2026-11-12 현장 RViz).
#
# 장애물 회피 경기장 (2026-11-12 노트북 teleop Space = gps_mark_logger #2~#5, RTK Fixed).
# 긴 두 변(노란 작은 부이 로프)은 전부 벽, 짧은 두 변(동쪽 입구·서쪽 출구)은 가운데 3 m 만 비움.
# ⚠ GNSS 안테나 위치이고 배를 모서리 부표 옆에 대고 찍어 ±1 m 오차가 있다.
#   (그때 원점 기준 x·y: #2 (136.20, −4.75) #3 (136.68, 3.20) #4 (111.15, 7.19) #5 (110.27, −2.07))
arenas:
  avoid:
    corners:
      - [35.18483600, 128.56659630]   # 0: #2 남동 (입구 남쪽)
      - [35.18490760, 128.56660160]   # 1: #3 북동 (입구 북쪽)
      - [35.18494360, 128.56632130]   # 2: #4 북서 (출구 북쪽)
      - [35.18486010, 128.56631160]   # 3: #5 남서 (출구 남쪽)
    openings:
      0: 3.0                          # 변 0 (#2 → #3) 동쪽 입구 가운데 3 m
      2: 3.0                          # 변 2 (#4 → #5) 서쪽 출구 가운데 3 m
