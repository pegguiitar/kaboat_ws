# ==============================================================================
# test_coordinates.yaml — 실내 수조(10m x 5m) 테스트 좌표 설정 파일
#
# 수조 평면도 및 좌표계 (단위: 미터 [m]):
#
#       Y = 5.0m ┌────────────────────────────────────────────────────────────┐
#                │                                                            │
#                │                   (5.0, 2.5) [수조 정중앙]                 │
#                │                                                            │
#       Y = 0.0m └────────────────────────────────────────────────────────────┘
#                X = 0.0m                                            X = 10.0m
#
# 1. 직선 주행 : (9.0, 3.0) -> (1.0, 3.0)
# 2. B-스플라인: (8.5, 2.0) -> (7.0, 3.5) -> (5.0, 1.5) -> (3.0, 3.5) -> (1.5, 2.5)
# 3. 원형 선회 : 중심 (5.0, 2.5), 반경 1.2m
# 4. 정점 유지 : 목표 (5.0, 2.5), 헤딩 180.0°
# ==============================================================================

# ── 1. 직선 주행 테스트 좌표 ──────────────────────────────────────────
straight_line_test:
  ros__parameters:
    start_x: 9.0              # [m] 출발 기준점 X
    start_y: 3.0              # [m] 출발 기준점 Y
    goal_x: 1.0               # [m] 목표 종점 X (총 8.0m 직진)
    goal_y: 3.0               # [m] 목표 종점 Y

# ── 2. B-Spline 곡선 경로 제어점 좌표 ──────────────────────────────────
bspline_track_test:
  ros__parameters:
    control_points_x: [8.5, 7.0, 5.0, 3.0, 1.5]
    control_points_y: [2.0, 3.5, 1.5, 3.5, 2.5]
    spline_degree: 3          # B-spline 차수 (Cubic)
    sample_spacing: 0.05      # [m] 곡선 보간 샘플 간격 (5cm)

# ── 3. 원형 선회 주행 테스트 좌표 ──────────────────────────────────────
circle_drive_test:
  ros__parameters:
    center_x: 5.0             # [m] 선회 원 중심 X (수조 중앙)
    center_y: 2.5             # [m] 선회 원 중심 Y (수조 중앙)
    radius: 1.2               # [m] 선회 반경 (1.2m -> 직경 2.4m 원)
    direction: "ccw"          # "ccw"(반시계) 또는 "cw"(시계)
    target_laps: 2.0          # 목표 완주 바퀴 수 (0.0: 무한 회전)

# ── 4. 웨이포인트 정점 유지 테스트 좌표 ────────────────────────────────
station_keeping_test:
  ros__parameters:
    target_x: 5.0             # [m] 목표 유지 위치 X (수조 중앙)
    target_y: 2.5             # [m] 목표 유지 위치 Y (수조 중앙)
    target_yaw_deg: 180.0     # [deg] 목표 선수각 (180°: -X방향, -999.0이면 위치만 유지)
    hold_duration_sec: 0.0    # [s] 목표 유지 시간 (0.0: 무한 유지)
    pos_deadband: 0.50        # [m] 위치 불감대 반경 (0.5m / 50cm)
    yaw_deadband_deg: 8.0     # [deg] 헤딩 불감대 각도 (8°)

