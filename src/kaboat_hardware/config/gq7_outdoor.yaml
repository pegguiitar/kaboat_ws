# 야외용 GQ7 설정 — ../sensor_check/gq7_bench.yaml (벤치에서 /ekf/odometry_map 발행 확인)
# 을 바탕으로 KABOAT 주행 코드에 맞춘 것.
#
# ⚠ device_setup: true — 드라이버가 시작할 때 아래 값을 장치에 쓴다(save_settings: false
#   라 장치 시작 설정으로 저장하지는 않음). 안테나 위치가 틀리면 헤딩이 틀어진다.
#
# /odom: 드라이버의 고정 원점 기능(filter_relative_position_*, /ekf/odometry_map)은 쓰지 않는다.
#   젯슨 드라이버에서 원점을 맞게 받고도 수백 km 떨어진 값을 냈다(2026-11-11 현장).
#   대신 gq7_local_odom(real_sensors outdoor:=true)이 /ekf/odometry_earth(ECEF)를
#   ~/kaboat_geo_origin.yaml 원점 기준 x=동·y=북으로 바꿔 /odom 으로 낸다.
microstrain_inertial_driver:
  ros__parameters:
    port: /dev/microstrain_main
    baudrate: 115200
    poll_port: true
    poll_rate_hz: 1.0
    poll_max_tries: -1
    reconnect_attempts: 10
    configure_after_reconnect: true

    device_setup: true
    save_settings: false

    use_enu_frame: true            # x = 동쪽, y = 북쪽, 각도 0 = 동쪽(반시계 +)
    frame_id: imu_link
    mount_frame_id: base_link
    target_frame_id: base_link
    # /ekf/odometry_map 은 안 쓴다(위 설명). frame_id 만 맞춰 둠.
    map_frame_id: odom
    publish_mount_to_frame_id_transform: false
    tf_mode: 0                     # TF 는 odom_tf_broadcaster 가 /odom 으로 발행

    # 배 위 실측 (2026-11-10): 좌우 안테나가 GQ7 에서 각각 0.4 m (간격 0.8 m).
    #   선수·상하 방향 차이는 0 으로 둠.
    #   GQ7 차량 좌표계(FRD): +X 선수, +Y 우현, +Z 아래, 센서 원점 → 안테나 위상 중심 [m]
    gnss1_antenna_offset_source: 1
    gnss1_antenna_offset: [0.0, -0.4, 0.0]    # GNSS 1: 좌현
    gnss2_antenna_offset_source: 1
    gnss2_antenna_offset: [0.0, 0.4, 0.0]     # GNSS 2: 우현

    # /ekf/odometry_map(/odom) 이 내는 위치의 기준점 = base_link(선체 중심).
    #   GQ7 → 기준점 벡터, 차량 좌표계(FRD) [m]. GQ7 이 선체 중심에 있어 0 (실측 2026-11-11).
    #   GQ7 을 옮기면 여기만 고친다 (선체 라이다 오프셋 0.4 m 등은 선체 중심 기준).
    filter_lever_arm_offset: [0.0, 0.0, 0.0]

    filter_enable_gnss_pos_vel_aiding: true
    filter_enable_gnss_heading_aiding: true
    filter_init_condition_src: 0
    filter_auto_heading_alignment_selector: 1  # 듀얼 안테나 헤딩
    filter_auto_init: true

    # 상대 위치 원점 (원점 파일이 있으면 런치가 source 1 + 고정 위도·경도로 덮어씀)
    # 드라이버 고정 원점 기능 끔 (/ekf/odometry_map 안 냄) — /odom 은 gq7_local_odom 이 만든다
    filter_relative_position_config: false

    # /odom 의 원본: 필터 위치(ECEF) + 자세 + 선체 기준 속도. gq7_local_odom 이 받는다.
    filter_odometry_earth_data_rate: 25

    # 듀얼 안테나 진단 (1 Hz)
    #   /mip/filter/gnss_dual_antenna_status — fix_type, rcv_1/2_data_valid, antenna_offsets_valid
    #   /ekf/dual_antenna_heading            — 두 안테나로 잰 헤딩 (fix 일 때만 의미)
    mip_filter_gnss_dual_antenna_status_data_rate: 1
    filter_dual_antenna_heading_data_rate: 1

    # 필터가 GNSS 보정을 실제로 쓰는지 진단 (1 Hz) — 2026-11-11 필터 위치가 GNSS 를 못 따라감
    #   /mip/ekf/aiding_measurement_summary — 보정원별 enabled / used / residual_high /
    #                                         sample_time_warning / configuration_error
    #   /mip/ekf/gnss_aiding_status           — 수신기별 fix·위성 사용 상태
    mip_filter_aiding_measurement_summary_data_rate: 1
    mip_filter_gnss_position_aiding_status_data_rate: 1

    ntrip_interface_enable: false
    raw_file_enable: false
