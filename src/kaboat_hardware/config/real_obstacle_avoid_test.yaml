# Jetson TG-50 /scan + indoor_tank /odom -> occupancy grid -> DRI/B-spline/FSM.
# Sim planner geometry and DRI defaults are inherited unless overridden below.
real_obstacle_avoid_test:
  ros__parameters:
    drive_enabled: false
    allow_escape: true                   # 경로를 못 만들면 후진 탈출(ESCAPE). false 면 정지
    goal_distance: 3.0                   # 고정 목표를 끄면(fixed_goal_enabled: false) 선수 앞 이 거리

    # 고정 목표 (수조 좌표). 배는 수조 어디서든(벽에서 tank_stop_margin 이상) 선수를
    # 목표 쪽으로 두면 출발한다 — 출발 조건은 선수가 목표 방향에서
    # start_heading_tolerance_deg 이내일 것. 방향 허용 >= 180 이면 방향 검사도 끈다.
    # 전방 장애물 확인 차선도 배→목표 방향이다.
    # 특정 시작점에서만 출발시키려면 fixed_start_xy: [x, y] 와 start_tolerance > 0 을 준다.
    fixed_goal_enabled: true
    fixed_goal_xy: [1.5, 2.5]          # 벽·벽 앞 구조물에서 떨어지게 (이전 1.0)
    start_tolerance: 0.0               # 0 = 시작 위치 검사 끔
    start_heading_tolerance_deg: 45.0
    goal_tolerance: 0.5
    require_front_obstacle: true
    front_corridor_half_width: 1.0
    max_cross_track_error: 0.7
    max_linear_cmd: 0.25                 # 전진 상한 = fsm.cmd_full 0.25 (0.3 이면 회피 경로에서 밀림)
    max_angular_cmd: 0.31                # 회전 상한 (2026-11-06 실물 튜닝, SOTA 는 0.23/0.33)
    odom_timeout_sec: 0.5
    scan_timeout_sec: 0.5
    grid_timeout_sec: 0.5
    viz_dri_scale: 4.0


    # 수조 벽 처리 — /odom 이 곧 수조 좌표(좌하단 원점, 가로 x 10 m × 세로 y 5 m,
    # lidar_tracker.yaml 의 pool_size 와 같은 값). 야외에는 벽이 없으므로 이 블록은
    # 수조 시험 전용이다. tank_bounds 를 0 으로 두면 전부 꺼진다.
    tank_bounds: [0.0, 0.0, 10.0, 5.0]   # [x_min, y_min, x_max, y_max]
    exclude_tank_walls: true             # 경계 띠 안·밖 점유 셀을 '벽'으로 보고 장애물에서 뺀다
    tank_wall_band: 0.5                  # 벽으로 보는 띠 폭 [m]. 벽 점이 경계 안쪽 0.4~0.5 m 까지
                                         # 퍼져 찍혀 0.3 이면 벽에 X 가 남았다. 벽에서 0.5 m 안
                                         # 의 진짜 장애물도 같이 벽으로 처리된다는 점에 주의
    tank_wall_dri: 0.5                   # 벽 DRI 상한. 지도엔 약하게 보이되 후보 필터 문턱(1.116 = 1.2 × 0.93)
                                         # 아래라 경로를 막지 않는다. 0 이면 벽 셀을 완전히 지움
    # 벽을 DRI 에서 빼면 플래너가 벽을 모르므로, 선체 중심이 경계에서 이 거리 안이면
    # 정지(해제)한다. 출발 때도 배·목표가 이 안쪽이어야 한다.
    # ⚠ 선체 반길이(≈0.55 m)보다 작은 값이다: 선수가 벽을 향해 있으면 정지 시점에
    #   이미 선수가 벽에 닿아 있고 타력으로 더 밀린다. 충돌이 걱정되면 키운다.
    tank_stop_margin: 0.5

    # 경로 추종(lookahead 0.8, slow_radius 1.5, cmd_full 0.25, 게인 1.4/0.16)은
    # test_los 에서 검증한 코드 기본값을 그대로 쓴다 — 여기서 fsm.* 를 덮어쓰지 않는다.
