# 실내 수조 시험 설정 — 외부 LiDAR 판 위치·yaw + 선체 GQ7 gyro 방향 선택 → /odom

indoor_lidar_odom:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    pose_topic: "/boat_pose"          # 횡단 판 선분으로 계산한 x, y, 180° 모호한 yaw
    imu_topic: "/imu/data"            # 선체 GQ7 IMU
    publish_tf: true                  # odom -> base_link TF 발행

    # ── 타이밍 및 타임아웃 ─────────────────────────────
    publish_rate: 30.0                # /odom 발행 주기 [Hz]
    pos_timeout_sec: 1.0              # 라이다 pose 유실 시 /odom 발행 중단 기준 [s]
    imu_timeout_sec: 0.5              # IMU 분기 예측 사용 가능 시간 [s]

    # ── LiDAR yaw + IMU gyro bias EKF ────────────────────
    yaw_rate_sign: -1.0               # GQ7 실측 부호 반전: 반시계 +, 시계 - (ROS REP-103)
    gyro_bias_z: 0.0                  # EKF 초기 Z축 bias [rad/s]
    gyro_noise_stddev: 0.01           # gyro 측정 잡음 [rad/s]
    gyro_bias_walk_stddev: 0.001      # bias random walk [rad/s/sqrt(s)]
    initial_gyro_bias_stddev: 0.05
    max_gyro_bias_abs: 0.20
    max_imu_predict_dt: 0.20
    lidar_yaw_stddev_deg: 2.0         # /boat_pose covariance가 없을 때 기본값
    lidar_yaw_gate_deg: 45.0          # IMU 예측 대비 LiDAR yaw 이상치 gate
    # 유효한 횡단 판 yaw는 매 스캔 /odom 헤딩에 반영한다.

    # 최초 앞뒤 분기를 확정하려면 선수를 -X(180도) 근처에 두고 정지 보정한다.
    # 이후 LiDAR 판 기울기가 헤딩을 결정하고 IMU는 180도 분기를 선택한다.
    require_yaw_calibration: true
    calibration_reference_yaw_deg: 180.0
    calibration_reference_tolerance_deg: 45.0
    calibration_window_sec: 2.0
    calibration_min_duration_sec: 1.5
    calibration_min_samples: 30
    calibration_max_rate_deviation: 0.02
    calibration_max_abs_bias: 0.10

    # ── 속도 추정 필터 (pose_velocity) ─────────────────
    vel_window_sec: 0.15
    vel_filter_tau: 0.15
    vel_max_speed: 3.0
    yaw_rate_ema_alpha: 0.30          # 판 yaw 차분 각속도 EMA (twist.angular.z)

    # ── 공분산 ─────────────────────────────────────────
    pose_stddev_xy: 0.03
    twist_stddev: 0.05
