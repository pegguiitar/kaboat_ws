# 실내 수조 시험 설정 — 외부 라이다(수조 GPS) + 선체 GQ7 IMU → /odom

indoor_lidar_odom:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    pos_topic: "/boat_position"       # 외부 라이다 추적기가 발행하는 배 절대 위치 (실내 GPS)
    imu_topic: "/imu/data"            # 선체 GQ7 IMU
    publish_tf: true                  # odom -> base_link TF 발행

    # ── 타이밍 및 타임아웃 ─────────────────────────────
    publish_rate: 30.0                # /odom 발행 주기 [Hz]
    pos_timeout_sec: 1.0              # 라이다 위치 수신 타임아웃 [s] (초과 시 /odom 중단 -> 워치독 정지)
    imu_timeout_sec: 0.5              # IMU 수신 타임아웃

    # ── 자세 및 헤딩 보정 ─────────────────────────────
    imu_yaw_offset_deg: 0.0           # 수조 +X축(0도) 기준 IMU 초기 설치 편차 [deg]
    yaw_rate_sign: 1.0                # 좌회전(반시계) 양수 부호 보정 (+1.0 또는 -1.0)
    gyro_bias_z: 0.0                  # Z축 각속도 정지 바이어스 [rad/s]

    # ── 속도 추정 필터 (pose_velocity) ─────────────────
    vel_window_sec: 0.15
    vel_filter_tau: 0.15
    vel_max_speed: 3.0

    # ── 공분산 ─────────────────────────────────────────
    pose_stddev_xy: 0.02
    pose_stddev_yaw: 0.02
    twist_stddev: 0.05
