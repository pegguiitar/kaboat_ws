# 실내 수조 고정 라이다 배 위치 추적 파라미터
# 수조: 좌하단 원점 (0,0), 가로 X: 10m (0~10m), 세로 Y: 5m (0~5m)
# 라이다: (10.0, 2.5) 오른쪽 벽 중앙에서 왼쪽(-X) 수조 안쪽을 향해 스캔
lidar_boat_tracker:
  ros__parameters:
    # ── 라이다 설치 좌표 (수조 좌하단 원점 0,0 기준) ───────────────
    lidar_pos_x: 10.0         # [m] 수조 오른쪽 벽
    lidar_pos_y: 2.5          # [m] 오른쪽 벽 중앙
    lidar_yaw_deg: 180.0      # [deg] 라이다 전방이 수조 왼쪽(-X)을 향함

    # ── 수조 규격 및 유효 ROI 필터 (가로 X: 10m, 세로 Y: 5m) ────────
    pool_size_x: 10.0         # [m] 수조 가로 길이 (오른쪽 방향 +X, 0~10m)
    pool_size_y: 5.0          # [m] 수조 세로 폭 (위쪽 주황색 화살표 방향 +Y, 0~5m)
    wall_margin: 0.18         # [m] 벽면 제거 마진 (수조 4면 벽면 노이즈 제거)

    # ── 두 봉을 잇는 횡단 판(중점 = base_link) ────────────────
    cluster_dist_tol: 0.15       # [m] 연속 스캔 점 사이 최대 거리
    panel_span: 0.60             # [m] 실제 판의 수평 길이
    panel_min_visible_span: 0.35 # [m] 이보다 짧으면 위치 중점이 불확실하여 거부
    panel_max_visible_span: 0.80 # [m] 봉 끝 반사 등을 포함할 수 있는 상한
    panel_min_points: 6          # 직선 맞춤에 필요한 최소 점 수
    panel_max_line_rms: 0.03     # [m] 직선에서 벗어난 점의 RMS 허용치
    max_position_jump: 0.75   # [m/scan] 연속 검출 위치 이상치 제한
    max_yaw_jump_deg: 60.0    # [deg/scan] 연속 검출 yaw 이상치 제한

    # ── EMA 노이즈 필터 계수 (0 < alpha <= 1.0) ─────────────────
    pos_ema_alpha: 0.45       # 위치 EMA 계수 (작을수록 부드러움)
    vel_ema_alpha: 0.30       # 속도 EMA 계수
    position_stddev: 0.03     # [m] LiDAR 중심 위치 표준편차
    panel_point_stddev: 0.02  # [m] 판 점 위치 표준편차
    min_yaw_stddev_deg: 1.0   # [deg] 발행 yaw 공분산 하한

    # ── 좌표계 프레임 및 발행 옵션 ───────────────────────────────
    odom_frame: "odom"
    base_frame: "base_link"
    laser_frame: "shore_laser_frame"
    publish_odom: false       # 실내 GPS 역할이므로 odom 발행 비활성 (배 내부 indoor_lidar_odom 사용)
    publish_tf: false         # odom->base_link TF 발행 비활성
