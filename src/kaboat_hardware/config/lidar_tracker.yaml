# 실내 수조 고정 라이다 배 위치 추적 파라미터
lidar_boat_tracker:
  ros__parameters:
    # ── 라이다 설치 좌표 (수조 좌하단 원점 0,0 기준) ───────────────
    lidar_pos_x: 5.0          # [m] 하단 변 정중앙
    lidar_pos_y: 0.0          # [m] 하단 벽면
    lidar_yaw_deg: 90.0       # [deg] +Y 수조 내부 전방 방향을 바라봄

    # ── 수조 규격 및 유효 ROI 필터 ──────────────────────────────
    pool_size_x: 10.0         # [m] 수조 가로 길이
    pool_size_y: 5.0          # [m] 수조 세로 길이
    wall_margin: 0.18         # [m] 벽면 및 벽 인접 노이즈 제거 마진 (수조 내부만 판정)

    # ── 배 돌출 구조물(기둥) 검출 조건 ───────────────────────────
    cluster_dist_tol: 0.25    # [m] 인접 포인트 군집화 거리
    min_cluster_pts: 2        # 기둥 최소 반사 포인트 수
    max_cluster_pts: 80       # 기둥 최대 반사 포인트 수
    min_target_diameter: 0.02 # [m] 기둥 최소 직경 (2cm)
    max_target_diameter: 0.45 # [m] 기둥 최대 직경 (45cm)

    # ── 좌표계 프레임 ───────────────────────────────────────────
    odom_frame: "odom"
    base_frame: "base_link"
    laser_frame: "laser_frame"
