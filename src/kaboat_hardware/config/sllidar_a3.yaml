# Shore RPLIDAR A3M1. The launch file overrides serial_port with the device by-id path.
sllidar_node:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/ttyUSB0
    serial_baudrate: 256000
    frame_id: shore_laser_frame
    inverted: false
    angle_compensate: true
    # Standard(4 kHz)는 수조 먼 쪽 판의 점 개수가 부족했다.
    # Sensitivity(16 kHz)는 이 장치에서 시작 시간 초과 또는 스캔 미발행이 발생했다.
    # Boost도 16 kHz이며, 이 노트북에서 /shore/scan 약 12.8 Hz를 확인했다.
    scan_mode: Boost
