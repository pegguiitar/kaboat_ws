# Shore RPLIDAR A3M1. The launch file overrides serial_port with the device by-id path.
sllidar_node:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/ttyUSB0
    serial_baudrate: 256000
    frame_id: shore_laser_frame
    inverted: false
    angle_compensate: true
    # Standard(4 kHz)는 한 바퀴 실측 약 110점이라 수조 먼 쪽 판에 점이 2~3개뿐이다.
    # Sensitivity(16 kHz)는 약 630점(1800빔 출력)이고 이 노트북에서 13.4 Hz로 동작했다.
    scan_mode: Sensitivity
