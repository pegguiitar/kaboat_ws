# 실내 수조 4개 꼭짓점 픽셀 좌표 (1280x720 해상도 기준)
# 순서: [좌하단 P0 (0,0), 우하단 P1 (10,0), 우상단 P2 (10,5), 좌상단 P3 (0,5)]
pool_size_x: 10.0   # [m] 수조 가로 길이
pool_size_y: 5.0    # [m] 수조 세로 길이
corners:
  p0_bottom_left:  [85, 640]    # (0.0m, 0.0m)
  p1_bottom_right: [1175, 650]  # (10.0m, 0.0m)
  p2_top_right:    [1160, 105]  # (10.0m, 5.0m)
  p3_top_left:     [200, 95]    # (0.0m, 5.0m)
