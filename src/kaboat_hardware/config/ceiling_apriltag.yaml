# 외부 USB 천장 카메라 AprilTag 검출 설정.
#
# 중요: size 는 태그의 검은 테두리 바깥 한 변을 자로 잰 실제 길이[m]로 바꾼다.
# 이 값이나 camera_info 보정값이 틀리면 검출은 돼도 /odom 거리 스케일은 틀린다.
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.300                 # 실제 태그 한 변 길이 [m] (30cm)
    max_hamming: 2              # 원거리 인식률 향상을 위한 해밍 에러 보정 (0 -> 2)
    pose_estimation_method: pnp
    detector:
      threads: 4
      decimate: 1.0             # 천장 카메라는 작은 태그를 보므로 해상도 축소 안함(1.0)
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    # 배에 부착한 태그 하나만 TF로 낸다. frame 이름은 indoor_tank.yaml과 맞춘다.
    tag:
      ids: [1]
      frames: ["tag36h11:1"]
      sizes: [0.300]
