# 노트북 천장 웹캠용 AprilTag 검출 설정.
#
# tag.size / tag.sizes 는 검은색 테두리 바깥쪽 한 변의 실제 길이[m]다.
# 프린터 배율 오차가 위치 스케일 오차로 그대로 이어지므로 반드시 자로 재서
# ceiling_apriltag.launch.py 의 tag_size 인자로 덮어쓴다.

/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.160
    max_hamming: 0
    qos_profile: sensor_data

    detector:
      threads: 2
      decimate: 1.5
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    pose_estimation_method: "pnp"

    # launch 인자가 이 목록을 덮어쓴다. 기본값은 tag36h11 ID 0 한 장이다.
    tag:
      ids: [0]
      frames: ["tag36h11:0"]
      sizes: [0.160]
