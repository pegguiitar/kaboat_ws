services:
  kaboat_sim_env:
    # 기본은 Docker Hub 이미지를 pull 해서 사용.
    image: peg0525/kaboat_2026_sim:latest
    # Dockerfile 을 고쳤을 때 로컬에서 즉시 검증할 수 있는 탈출구.
    #   docker compose up -d --build   # 이 저장소의 Dockerfile 로 직접 빌드
    # (평소 `docker compose up -d` 는 그대로 Hub 이미지를 pull 한다.)
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaboat_sim_container
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      # 호스트의 src(kaboat_sim, vrx, ros_gz 포함)를 컨테이너 내부 워크스페이스의 src로 마운트
      - ./src:/workspace/kaboat_ws/src
      # vrx.repos / scripts/ 는 src/ 밖(저장소 루트)에 있어서 별도로 마운트해야
      # 컨테이너 안에서 ./scripts/setup_workspace.sh, vcs import 가 보인다.
      # (build/install/log 는 여전히 컨테이너 전용 — 호스트에 root 소유 파일이
      # 남지 않도록 일부러 통째로 마운트하지 않았다.)
      - ./vrx.repos:/workspace/kaboat_ws/vrx.repos:ro
      - ./scripts:/workspace/kaboat_ws/scripts:ro
      # GUI 화면 출력을 위한 X11 소켓 공유
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stdin_open: true
    tty: true